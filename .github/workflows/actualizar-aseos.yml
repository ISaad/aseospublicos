name: Actualizar aseos

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar los puntos de My Maps
        run: python3 scripts/actualizar-aseos.py

      - name: Publicar si hay cambios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/aseos.json; then
            echo "Sin cambios en el mapa."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aseos.json
          git commit -m "Update toilet data from My Maps"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
